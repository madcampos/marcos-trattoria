<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Contact Form | Marco&rsquo;s Trattoria</title>
	</head>
	<body>
		<form action="/contact/thank-you.html" method="post">
			<p>
				<label for="contact-name">Your Name</label> <input type="text" name="name" id="contact-name" />
			</p>
			<p>
				<label for="contact-email">Your Email</label> <input type="email" name="email" id="contact-email" />
			</p>
			<p>
				<label for="contact-message">Your Message</label> <textarea name="message" id="contact-message" cols="22" rows="10"></textarea>
			</p>
			<button type="submit">Submit</button>
		</form>
	</body>
</html>
