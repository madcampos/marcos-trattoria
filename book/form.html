<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Booking Form | Marco&rsquo;s Trattoria</title>
		<link rel="stylesheet" href="/assets/css/index.css" />
		<link rel="stylesheet" href="/assets/css/pages/book-form.css" />
	</head>
	<body>
		<!-- #region SVG assets -->
		<svg-defs role="none" aria-hidden="true">
			<svg width="1" height="1" viewBox="0 0 24 24">
				<defs>
					<symbol id="uil--envelope" viewBox="0 0 24 24">
						<path
							fill="currentColor"
							d="M19 4H5a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3m-.41 2l-5.88 5.88a1 1 0 0 1-1.42 0L5.41 6ZM20 17a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7.41l5.88 5.88a3 3 0 0 0 4.24 0L20 7.41Z"
						/>
					</symbol>
					<symbol id="uil--user" viewBox="0 0 24 24">
						<path
							fill="currentColor"
							d="M15.71 12.71a6 6 0 1 0-7.42 0a10 10 0 0 0-6.22 8.18a1 1 0 0 0 2 .22a8 8 0 0 1 15.9 0a1 1 0 0 0 1 .89h.11a1 1 0 0 0 .88-1.1a10 10 0 0 0-6.25-8.19M12 12a4 4 0 1 1 4-4a4 4 0 0 1-4 4"
						/>
					</symbol>
					<symbol id="uil--accessible-icon-alt" viewBox="0 0 24 24">
						<path
							fill="currentColor"
							d="M16 7a2 2 0 1 0-2-2a2 2 0 0 0 2 2m-3.3 11.4A4 4 0 1 1 9.05 12a1 1 0 1 0-.22-2a6 6 0 0 0 .67 12a6 6 0 0 0 4.8-2.4a1 1 0 0 0-1.6-1.2m6.8 1.6h-1v-5a1 1 0 0 0-1-1h-4.57l1.69-4.66v-.31a1 1 0 0 0 0-.18a1 1 0 0 0 0-.19a1.4 1.4 0 0 0-.09-.17a.7.7 0 0 0-.11-.15a.6.6 0 0 0-.15-.13s0-.06-.08-.08L9.71 5.55h-.12a1 1 0 0 0-.19-.06H9a.8.8 0 0 0-.2.07h-.11L6 7.13A1 1 0 0 0 6.48 9A1 1 0 0 0 7 8.87l2.23-1.3l3.24 1.88l-1.89 5.21a1 1 0 0 0 0 .16a.6.6 0 0 0 0 .18a3 3 0 0 0 .08.38l.11.15a.6.6 0 0 0 .11.16a.7.7 0 0 0 .14.09a1.2 1.2 0 0 0 .19.12a1 1 0 0 0 .34.06h5v5a1 1 0 0 0 1 1h2a1 1 0 0 0 0-2Z"
						/>
					</symbol>
					<symbol id="uil--clock" viewBox="0 0 24 24">
						<path
							fill="currentColor"
							d="M15.098 12.634L13 11.423V7a1 1 0 0 0-2 0v5a1 1 0 0 0 .5.866l2.598 1.5a1 1 0 1 0 1-1.732M12 2a10 10 0 1 0 10 10A10.01 10.01 0 0 0 12 2m0 18a8 8 0 1 1 8-8a8.01 8.01 0 0 1-8 8"
						/>
					</symbol>
					<symbol id="uil--calendar-alt" viewBox="0 0 24 24">
						<path
							fill="currentColor"
							d="M12 19a1 1 0 1 0-1-1a1 1 0 0 0 1 1m5 0a1 1 0 1 0-1-1a1 1 0 0 0 1 1m0-4a1 1 0 1 0-1-1a1 1 0 0 0 1 1m-5 0a1 1 0 1 0-1-1a1 1 0 0 0 1 1m7-12h-1V2a1 1 0 0 0-2 0v1H8V2a1 1 0 0 0-2 0v1H5a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V6a3 3 0 0 0-3-3m1 17a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9h16Zm0-11H4V6a1 1 0 0 1 1-1h1v1a1 1 0 0 0 2 0V5h8v1a1 1 0 0 0 2 0V5h1a1 1 0 0 1 1 1ZM7 15a1 1 0 1 0-1-1a1 1 0 0 0 1 1m0 4a1 1 0 1 0-1-1a1 1 0 0 0 1 1"
						/>
					</symbol>
					<symbol id="uil--phone" viewBox="0 0 24 24">
						<path
							fill="currentColor"
							d="M19.44 13c-.22 0-.45-.07-.67-.12a9.4 9.4 0 0 1-1.31-.39a2 2 0 0 0-2.48 1l-.22.45a12.2 12.2 0 0 1-2.66-2a12.2 12.2 0 0 1-2-2.66l.42-.28a2 2 0 0 0 1-2.48a10 10 0 0 1-.39-1.31c-.05-.22-.09-.45-.12-.68a3 3 0 0 0-3-2.49h-3a3 3 0 0 0-3 3.41a19 19 0 0 0 16.52 16.46h.38a3 3 0 0 0 2-.76a3 3 0 0 0 1-2.25v-3a3 3 0 0 0-2.47-2.9m.5 6a1 1 0 0 1-.34.75a1.05 1.05 0 0 1-.82.25A17 17 0 0 1 4.07 5.22a1.1 1.1 0 0 1 .25-.82a1 1 0 0 1 .75-.34h3a1 1 0 0 1 1 .79q.06.41.15.81a11 11 0 0 0 .46 1.55l-1.4.65a1 1 0 0 0-.49 1.33a14.5 14.5 0 0 0 7 7a1 1 0 0 0 .76 0a1 1 0 0 0 .57-.52l.62-1.4a14 14 0 0 0 1.58.46q.4.09.81.15a1 1 0 0 1 .79 1Z"
						/>
					</symbol>
					<symbol id="uil--times" viewBox="0 0 24 24">
						<path
							fill="currentColor"
							d="m13.41 12l4.3-4.29a1 1 0 1 0-1.42-1.42L12 10.59l-4.29-4.3a1 1 0 0 0-1.42 1.42l4.3 4.29l-4.3 4.29a1 1 0 0 0 0 1.42a1 1 0 0 0 1.42 0l4.29-4.3l4.29 4.3a1 1 0 0 0 1.42 0a1 1 0 0 0 0-1.42Z"
						/>
					</symbol>
					<symbol id="uil--check" viewBox="0 0 24 24">
						<path fill="currentColor" d="M18.71 7.21a1 1 0 0 0-1.42 0l-7.45 7.46l-3.13-3.14A1 1 0 1 0 5.29 13l3.84 3.84a1 1 0 0 0 1.42 0l8.16-8.16a1 1 0 0 0 0-1.47" />
					</symbol>
				</defs>
			</svg>
		</svg-defs>
		<!-- #endregion -->

		<form action="/book/thank-you.html" method="post">
			<div>
				<div>
					<x-icon role="presentation" aria-hidden="true">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--user" /></svg>
					</x-icon>

					<label for="book-name">Your Name</label>
				</div>

				<div>
					<x-icon role="presentation" aria-hidden="true" class="error-mark">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--times" /></svg>
					</x-icon>
					<x-icon role="presentation" aria-hidden="true" class="valid-mark">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--check" /></svg>
					</x-icon>
					<input
						type="text"
						name="name"
						id="book-name"
						required
						autofocus
						autocapitalize="words"
						autocomplete="name"
						aria-describedby="book-name-error-message"
					/>
				</div>
				<span class="error-message" id="book-name-error-message">Please provide your name.</span>
			</div>

			<div>
				<div>
					<x-icon role="presentation" aria-hidden="true">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--envelope" /></svg>
					</x-icon>
					<label for="book-email">Your Email</label>
				</div>

				<div>
					<x-icon role="presentation" aria-hidden="true" class="error-mark">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--times" /></svg>
					</x-icon>
					<x-icon role="presentation" aria-hidden="true" class="valid-mark">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--check" /></svg>
					</x-icon>
					<input
						type="email"
						name="email"
						id="book-email"
						required
						autocomplete="email"
						inputmode="email"
						aria-describedby="book-email-error-message"
					/>
				</div>
				<span class="error-message" id="book-email-error-message">Please provide a valid email address.</span>
			</div>

			<div>
				<div>
					<x-icon role="presentation" aria-hidden="true">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--phone" /></svg>
					</x-icon>

					<label for="book-phone">Your Phone</label>
				</div>

				<div>
					<x-icon role="presentation" aria-hidden="true" class="error-mark">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--times" /></svg>
					</x-icon>
					<x-icon role="presentation" aria-hidden="true" class="valid-mark">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--check" /></svg>
					</x-icon>
					<input
						type="tel"
						name="phone"
						id="book-phone"
						required
						autocapitalize="off"
						autocomplete="tel"
						inputmode="tel"
						aria-describedby="book-phone-error-message"
					/>
				</div>
				<span class="error-message" id="book-phone-error-message">Please provide a valid phone number.</span>
			</div>

			<div>
				<div>
					<x-icon role="presentation" aria-hidden="true">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--calendar-alt" /></svg>
					</x-icon>

					<label for="book-date">Date</label>
				</div>

				<div>
					<x-icon role="presentation" aria-hidden="true" class="error-mark">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--times" /></svg>
					</x-icon>
					<x-icon role="presentation" aria-hidden="true" class="valid-mark">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--check" /></svg>
					</x-icon>
					<input
						type="date"
						name="date"
						id="book-date"
						required
						aria-describedby="book-date-error-message"
					/>
				</div>
				<span class="error-message" id="book-date-error-message">Please select a valid date.</span>
			</div>

			<div>
				<div>
					<x-icon role="presentation" aria-hidden="true">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--clock" /></svg>
					</x-icon>
					<label for="book-time">Time</label>
				</div>

				<div>
					<x-icon role="presentation" aria-hidden="true" class="error-mark">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--times" /></svg>
					</x-icon>
					<x-icon role="presentation" aria-hidden="true" class="valid-mark">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--check" /></svg>
					</x-icon>
					<select
						name="time"
						id="book-time"
						required
						aria-describedby="book-time-error-message"
					>
						<option disabled selected hidden value="">Select a time</option>
						<optgroup label="Morning">
							<option value="10:00">10:00 am</option>
							<option value="11:00">11:00 am</option>
							<option value="12:00">12:00 pm</option>
							<option value="13:00">1:00 pm</option>
							<option value="14:00">2:00 pm</option>
							<option value="15:00">3:00 pm</option>
						</optgroup>
						<optgroup label="Evening">
							<option value="16:00">4:00 pm</option>
							<option value="17:00">5:00 pm</option>
							<option value="18:00">6:00 pm</option>
							<option value="19:00">7:00 pm</option>
							<option value="20:00">8:00 pm</option>
							<option value="21:00">9:00 pm</option>
							<option value="22:00">10:00 pm</option>
							<option value="23:00">11:00 pm</option>
						</optgroup>
					</select>
				</div>
				<span class="error-message" id="book-time-error-message">Please select a time.</span>
			</div>

			<div>
				<div>
					<x-icon role="presentation" aria-hidden="true">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--accessible-icon-alt" /></svg>
					</x-icon>
					<label for="book-special-needs">Special needs</label>
				</div>

				<div>
					<x-icon role="presentation" aria-hidden="true" class="error-mark">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--times" /></svg>
					</x-icon>
					<x-icon role="presentation" aria-hidden="true" class="valid-mark">
						<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--check" /></svg>
					</x-icon>
					<textarea
						name="special-needs"
						id="book-special-needs"
						cols="22"
						rows="10"
						autocapitalize="on"
					></textarea>
				</div>
			</div>

			<div>
				<button type="reset">Reset</button>
				<button type="submit">Submit</button>
			</div>
		</form>
	</body>
</html>
