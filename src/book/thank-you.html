<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Thank You for Booking | Marco&rsquo;s Trattoria</title>
		<link rel="stylesheet" href="/assets/css/index.css" />
		<link rel="stylesheet" href="/assets/css/pages/thank-you.css" />
		<script type="module" src="/assets/script/book-reminder.js"></script>
	</head>
	<body>
		<!-- #region SVG assets -->
		<svg-defs role="none" aria-hidden="true">
			<svg width="1" height="1" viewBox="0 0 24 24">
				<defs>
					<symbol id="uil--bell" viewBox="0 0 24 24">
						<path
							fill="currentColor"
							d="M18 13.18V10a6 6 0 0 0-5-5.91V3a1 1 0 0 0-2 0v1.09A6 6 0 0 0 6 10v3.18A3 3 0 0 0 4 16v2a1 1 0 0 0 1 1h3.14a4 4 0 0 0 7.72 0H19a1 1 0 0 0 1-1v-2a3 3 0 0 0-2-2.82M8 10a4 4 0 0 1 8 0v3H8Zm4 10a2 2 0 0 1-1.72-1h3.44A2 2 0 0 1 12 20m6-3H6v-1a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1Z"
						/>
					</symbol>
					<symbol id="uil--file-download" viewBox="0 0 24 24">
						<path
							fill="currentColor"
							d="M20 8.94a1.3 1.3 0 0 0-.06-.27v-.09a1 1 0 0 0-.19-.28l-6-6a1 1 0 0 0-.28-.19h-.1a1.1 1.1 0 0 0-.31-.11H7a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3zm-6-3.53L16.59 8H15a1 1 0 0 1-1-1ZM18 19a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5v3a3 3 0 0 0 3 3h3Zm-4.71-4.71l-.29.3V12a1 1 0 0 0-2 0v2.59l-.29-.3a1 1 0 0 0-1.42 1.42l2 2a1 1 0 0 0 .33.21a.94.94 0 0 0 .76 0a1 1 0 0 0 .33-.21l2-2a1 1 0 0 0-1.42-1.42"
						/>
					</symbol>
				</defs>
			</svg>
		</svg-defs>
		<!-- #endregion -->

		<header>
			<hero-image></hero-image>
			<hgroup>
				<h1>Thank You!</h1>
				<p>Your Reservation is complete</p>
				<div>
					<button type="button" id="booking-alert">
						<x-icon role="presentation" aria-hidden="true">
							<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--bell" /></svg>
						</x-icon>
						<span>Get Booking Reminders</span>
					</button>
					<button type="button" id="booking-save">
						<x-icon role="presentation" aria-hidden="true">
							<svg width="24" height="24" viewBox="0 0 24 24"><use href="#uil--file-download" /></svg>
						</x-icon>
						<span>Download Booking Details</span>
					</button>
				</div>
			</hgroup>
		</header>
	</body>
</html>
